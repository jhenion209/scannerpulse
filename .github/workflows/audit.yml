name: audit
# Checks Cargo.lock against the RustSec advisory database: every Monday, and
# whenever the lock file changes.
on:
  schedule:
    - cron: "17 6 * * 1"
  push:
    branches: [main]
    paths: [Cargo.lock]
  pull_request:
    paths: [Cargo.lock]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo install cargo-audit --locked
      # RUSTSEC-2023-0071 (rsa, no fix released) is a timing attack on the
      # private key; jsonwebtoken only verifies sign-in tokens with the
      # identity provider's public keys.
      - run: cargo audit --ignore RUSTSEC-2023-0071
