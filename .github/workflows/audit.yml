name: audit
# Checks Cargo.lock against the RustSec advisory database: every Monday, and
# whenever the lock file changes.
on:
  schedule:
    - cron: "17 6 * * 1"
  push:
    branches: [main]
    paths: [Cargo.lock]
  pull_request:
    paths: [Cargo.lock]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo install cargo-audit --locked
      # RUSTSEC-2023-0071 (rsa, no fix released) is a timing attack on the
      # private key; jsonwebtoken only verifies sign-in tokens with the
      # identity provider's public keys. RUSTSEC-2026-0381 matches
      # webpki-roots 0.26.11, sqlx's shim, by its version: it re-exports
      # webpki-roots 1.x, which the lock holds at 1.0.10, the patched release.
      # RUSTSEC-2026-0387 (crypto-bigint 0.5, fixed only in 0.7) is timing
      # variability in constant-time operations; it comes through
      # jsonwebtoken's p256 and p384 0.13 (11.1.0 is the newest), which only
      # verify sign-in tokens with the identity provider's public keys:
      # nothing secret is computed. RUSTSEC-2026-0459 (libsqlite3-sys 0.30.1,
      # fixed in 0.39) is in the lock only as sqlx-sqlite's optional
      # dependency: sqlx here enables postgres and not sqlite, so the crate
      # is never compiled. A fix needs sqlx 0.9.
      - run: cargo audit --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2026-0381 --ignore RUSTSEC-2026-0387 --ignore RUSTSEC-2026-0459
