name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      # The frontend first: the binary embeds web/dist when it is built.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run check
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # End to end: the debug binary, with the page embedded, over a database
      # of invented calls.
      - run: cargo build --locked
      - run: psql "$DATABASE_URL" -c "CREATE DATABASE sp_e2e TEMPLATE template0 ENCODING 'UTF8' LOCALE 'C.UTF-8'"
      - run: web/e2e/seed.sh target/debug/scannerpulse "$RUNNER_TEMP/e2e-archive"
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/sp_e2e
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run e2e
        working-directory: web
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/sp_e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-results
          path: |
            web/playwright-report
            web/test-results
