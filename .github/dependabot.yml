version: 2
# Weekly update pull requests; minor and patch updates come grouped, one
# pull request per ecosystem.
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        update-types: [minor, patch]
    ignore:
      # jsonwebtoken 10 and later need a crypto backend chosen: aws-lc-rs
      # (C, a harder static build) or RustCrypto (which builds rsa, open
      # advisory RUSTSEC-2023-0071). 9 uses ring, as rustls here does; the
      # weekly audit says if 9 needs leaving.
      - dependency-name: jsonwebtoken
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      npm:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
