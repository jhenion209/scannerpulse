[package]
name = "scannerpulse"
description = "Records, archives and plays back trunked radio calls."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
argon2 = "0.6"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query", "ws", "macros"] }
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
chrono-tz = "0.10"
crc32fast = "1"
crossterm = "0.29"
getrandom = "0.4"
id3 = "1"
include_dir = "0.7"
inquire = "0.9"
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
notify = "8"
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["multipart", "rustls-tls"] }
rustix = { version = "1", default-features = false, features = ["std", "fs", "process"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "macros", "json", "chrono"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "sync"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["fs"] }
x509-parser = "0.18"

[dev-dependencies]
futures-util = "0.3"
http-body-util = "0.1"
ring = "0.17"
tempfile = "3"
tokio-tungstenite = "0.30"
